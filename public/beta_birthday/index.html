<style>
  :root {
    --ink: #1c2733;
    --steel: #3e5871;
    --paper: #ffffff;
    --ash: #6b7a89;
    --blade: #e7131a;
    --ember: #e8a33d;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Public Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--paper);
    padding-top: 56px;
  }

  .logo-band {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 24px 4px;
  }

  .logo {
    width: auto;
    height: auto;
    max-width: min(92%, 560px);
    max-height: 46vh;
    display: block;
    margin: 0 auto;
  }

  .stage {
    width: 100%;
    max-width: 460px;
    text-align: center;
    padding: 0 24px 48px;
  }

  /* ---------- THE 50 ---------- */

  .fifty-wrap {
    position: relative;
    margin: 8px auto 4px;
    width: fit-content;
  }

  .fifty {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(7rem, 34vw, 10.5rem);
    line-height: 0.85;
    color: var(--blade);
    letter-spacing: -0.02em;
    transform: rotate(-4deg);
    display: inline-block;
  }

  .celebrating-tag {
    position: absolute;
    top: 2%;
    left: -2%;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 700;
    font-size: clamp(1.1rem, 5vw, 1.5rem);
    color: var(--ember);
    transform: rotate(-22deg);
    white-space: nowrap;
    text-shadow: 0 2px 4px rgba(28, 39, 51, 0.15);
  }

  .fifty-tag {
    position: absolute;
    top: 4%;
    right: -20%;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    color: var(--blade);
    background: var(--paper);
    border: 1.5px solid var(--blade);
    padding: 4px 10px;
    border-radius: 20px;
    transform: rotate(9deg);
    white-space: nowrap;
  }

  /* confetti */
  .confetti {
    position: absolute;
    pointer-events: none;
  }
  .confetti.c-circle { border-radius: 50%; }
  .confetti.c-square { transform: rotate(20deg); }
  .confetti.c-dash { border-radius: 3px; }

  .conf1 { top: -8%;  left: -12%; width: 14px; height: 14px; background: var(--ember); border-radius: 50%; transform: rotate(0deg); }
  .conf2 { top: 4%;   left: -22%; width: 10px; height: 22px; background: var(--steel); border-radius: 3px; transform: rotate(-25deg); }
  .conf3 { top: 60%;  left: -18%; width: 12px; height: 12px; background: var(--blade); border-radius: 50%; }
  .conf4 { top: 82%;  left: -8%;  width: 16px; height: 6px;  background: var(--ember); border-radius: 3px; transform: rotate(18deg); }
  .conf5 { top: -12%; right: -6%; width: 12px; height: 12px; background: var(--steel); border-radius: 50%; }
  .conf6 { top: 70%;  right: -14%; width: 10px; height: 20px; background: var(--blade); border-radius: 3px; transform: rotate(30deg); }
  .conf7 { top: 30%;  right: -22%; width: 13px; height: 13px; background: var(--ember); border-radius: 50%; }

  .bday-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-auto-rows: 1fr;
    gap: 5px;
    width: 100%;
    aspect-ratio: 6 / 8;
    margin: 0 auto;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1rem, 4.5vw, 1.3rem);
    color: #ffffff;
    border: 2px solid var(--ink);
    border-radius: 4px;
  }

  .cell.pink  { background: #f5a1a3; }
  .cell.teal  { background: #5a8a91; }
  .cell.gold  { background: #c4a84d; }
  .cell.sage  { background: #6a9b6e; }

  .cell.cross {
    border-color: var(--blade);
    box-shadow: 0 0 0 2px var(--blade);
  }

  .bracket-frame {
    position: relative;
    padding: 10px;
    margin: 26px auto 0;
    max-width: 340px;
  }

  .grid-frame {
    position: relative;
    z-index: 1;
    margin: 0;
    padding: 32px 26px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 26px rgba(28, 39, 51, 0.12);
  }

  .brk { position: absolute; z-index: 2; background: var(--blade); }

  .brk-tl-v1 { top: 0;    left: 0;   width: 3px; height: 80%; }
  .brk-tl-h1 { top: 0;    left: 0;   height: 3px; width: 34px; }
  .brk-tl-v2 { top: 9px;  left: 9px; width: 3px; height: 72%; }
  .brk-tl-h2 { top: 9px;  left: 9px; height: 3px; width: 26px; }

  .brk-br-v1 { bottom: 0;   right: 0;  width: 3px; height: 80%; }
  .brk-br-h1 { bottom: 0;   right: 0;  height: 3px; width: 34px; }
  .brk-br-v2 { bottom: 9px; right: 9px; width: 3px; height: 72%; }
  .brk-br-h2 { bottom: 9px; right: 9px; height: 3px; width: 26px; }

  .screenshot-wrap {
    margin: 0 auto;
    max-width: 300px;
  }

  .screenshot-wrap img {
    display: block;
    width: 100%;
    height: auto;
  }

  .screenshot-caption {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ash);
    margin-top: 10px;
  }

  .line {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.2rem, 5.5vw, 1.5rem);
    color: var(--ink);
    margin-top: 22px;
    line-height: 1.35;
  }

  /* ---------- CTA ---------- */

  .cta-panel {
    margin-top: 40px;
  }

  .cta-btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }

  .cta-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 20px 8px;
    border-radius: 10px;
    border: 2px solid var(--blade);
    background: var(--blade);
    color: #fff;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 0.02em;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .cta-btn .cta-icon { font-size: 1.6rem; line-height: 1; }

  .cta-btn:hover { background: #c81017; }
  .cta-btn:active { transform: scale(0.97); }

  .cta-btn.android {
    background: #34a853;
    border-color: #34a853;
  }
  .cta-btn.android:hover { background: #2c9247; }

  .cta-note {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    color: var(--ash);
    text-align: center;
  }
</style>
