name: Daily Teaser

on:
  schedule:
    # 5:00 AM UTC = midnight US Eastern (during daylight saving time)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to generate teaser for (YYYY-MM-DD). Defaults to today.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-teaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node-canvas system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev build-essential

      - name: Install teaser-generator dependencies
        run: |
          cd teaser-generator
          npm install

      - name: Generate teaser image
        run: |
          cd teaser-generator
          if [ -n "${{ github.event.inputs.date }}" ]; then
            npm run generate -- --date "${{ github.event.inputs.date }}"
          else
            npm run generate
          fi

      - name: Copy teaser to public/teaser/
        run: |
          mkdir -p public/teaser
          cp teaser-generator/output/daily-teaser.png public/teaser/daily-teaser.png

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/teaser/daily-teaser.png
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(date -u +%Y-%m-%d)
          else
            # Normalize to zero-padded YYYY-MM-DD in case input was e.g. 2026-4-18
            DATE=$(date -u -d "$DATE" +%Y-%m-%d)
          fi
          git commit -m "chore: update daily teaser for ${DATE}" || echo "Nothing to commit"
          git pull --rebase origin main
          git push
