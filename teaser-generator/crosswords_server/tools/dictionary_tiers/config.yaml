# Dictionary tier build configuration.
# This file is used by build_wordlists.py and is safe to edit.

tiers:
  tier1_junior:
    zipf_min: 5.0
    min_len: 3
    max_len: 5
  tier2_core:
    zipf_min: 4.5
    min_len: 3
    max_len: 6
  tier3_standard:
    zipf_min: 4.0
    min_len: 4
    max_len: 6
  tier4_advanced:
    zipf_min: 3.3
    min_len: 4
    max_len: 7
  tier5_twl:
    zipf_min: 2.2
    min_len: 4
    max_len: 7

# "highest_only" = assign each candidates word to highest tier it qualifies for among 1-4.
# "multi" = assign candidates words to every tier it qualifies for among 1-4.
assignment_mode: "multi"

# "allow" = keep overlap between tier5 and tiers 1-4.
# "remove_from_1to4" = remove tier5 words from tiers 1-4.
tier5_overlap_policy: "allow"

# Filters and behavior toggles.
exclude_capitalized_candidates: false
exclude_capitalized_twl: false
enforce_twl_zipf_cutoff: true
allow_twl_unknown_zipf: false
enforce_us_spelling_for_1to4: true
lower_tier_exclude_simple_plurals: true

# Top dictionary (canon) active range. Keep 4-6 now; 7+ is deferred.
canon_min_len: 4
canon_max_len: 6

# Difficulty shaping for rebuilt middle tiers.
# Core preserves the legacy curated list after cleanup.
# Standard and advanced add broader vocabulary using Zipf floors.
standard_min_zipf: 2.7
advanced_min_zipf: 1.8

# Slur/hate terms to remove from canon and all lower tiers.
# Supports .txt (one word per line) or .json array.
slur_hate_denylist_path: "./slur_hate_denylist.txt"

# UK/alternate -> US preferred mapping for lower tiers only.
# YAML mapping example:
#   armour: armor
#   colours: colors
lower_tier_us_variant_map_path: "./us_variant_map.yaml"

# Output format for exported tier .txt files and CSV `word` column.
# Allowed: "uppercase", "lowercase".
output_case: "uppercase"

# US allowlist for tiers 1-4.
# Supports .txt (one word per line) or .json (array of words).
# Default points to your current "Everyday" list in the mobile app.
us_allowlist_path: "../../../crosswords_server/data/wordlist_common_4_6.json"

# Optional force-keep list for tiers 1-4 (after all normalization), useful for edge cases.
us_keep_exceptions_path: "./us_keep_exceptions.txt"
