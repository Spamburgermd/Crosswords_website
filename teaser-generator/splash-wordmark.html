<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CrosSwordS Wordmark — Screenshot at 1050x240</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #e0e0e0;
    font-family: sans-serif;
  }
  .instructions {
    margin-bottom: 20px;
    color: #333;
    font-size: 14px;
    text-align: center;
    line-height: 1.6;
  }
  .frame {
    border: 1px dashed #999;
    position: relative;
  }
  .frame::after {
    content: '1050 × 240';
    position: absolute;
    top: -20px;
    right: 0;
    font-size: 11px;
    color: #999;
  }
  .wordmark {
    width: 1050px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Checkerboard = transparent */
    background: repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 0 0 / 20px 20px;
  }
  .text {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 700;
    font-size: 96px;
    letter-spacing: 4px;
    color: #000;
    user-select: none;
  }
  .red { color: #E7131A; }

  /* Version on white bg for easy screenshot */
  .wordmark-white {
    width: 1050px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    margin-top: 30px;
  }
</style>
</head>
<body>
  <div class="instructions">
    <strong>Screenshot Guide:</strong><br>
    Right-click the white version below → "Save image" or screenshot the 1050×240 area.<br>
    Save as PNG with transparent background if possible, otherwise use the white version.
  </div>

  <div class="frame">
    <div class="wordmark">
      <span class="text">CROS<span class="red">S</span>WORD<span class="red">S</span></span>
    </div>
  </div>

  <div class="frame" style="margin-top: 30px;">
    <div class="wordmark-white">
      <span class="text">CROS<span class="red">S</span>WORD<span class="red">S</span></span>
    </div>
  </div>
</body>
</html>
