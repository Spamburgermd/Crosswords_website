<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Crossword Mockup</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #bcbec2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #2c2d33;
    }

    .scene {
      width: min(92vw, 420px);
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .crossword-grid {
      margin: 0 auto 20px;
      padding: 22px 24px;
      border-radius: 0px;
      background: linear-gradient(165deg, #f7f7fa 0%, #d6d6de 100%);
      border: 1px solid #c5c6ce;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), inset 0 -10px 16px rgba(0, 0, 0, 0.08), 0 20px 35px rgba(0, 0, 0, 0.18);
      display: grid;
      grid-template-columns: repeat(7, 24px);
      grid-template-rows: repeat(6, 24px);
      gap: 1px;
      justify-content: center;
    }

    .cell {
      width: 24px;
      height: 24px;
      border-radius: 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }

    .cell.white {
      background: linear-gradient(180deg, #ffffff 0%, #f4f4f6 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 1px 0 rgba(255, 255, 255, 0.45),
        0 0 0 1px rgba(18, 19, 25, 0.9);
      color: #121314;
    }

    .cell.white.shadow-br {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 1px 0 rgba(255, 255, 255, 0.45),
        0 0 0 1px rgba(18, 19, 25, 0.9),
        8px 12px 18px rgba(18, 19, 25, 0.36),
        3px 6px 12px rgba(18, 19, 25, 0.22);
    }

    .cell.white.blank {
      color: transparent;
      opacity: 0.85;
    }

    .cell.block {
      background: #0f1013;
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.18),
        0 0 0 1px rgba(18, 19, 25, 0.9);
    }

    .cell.block.shadow-br {
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.18),
        0 0 0 1px rgba(18, 19, 25, 0.9),
        8px 12px 18px rgba(18, 19, 25, 0.46),
        3px 6px 12px rgba(18, 19, 25, 0.3);
    }

    @media (max-width: 480px) {
      .crossword-grid {
        padding: 18px;
        gap: 1px;
        grid-template-columns: repeat(10, 32px);
        grid-template-rows: repeat(11, 32px);
      }

      .cell {
        width: 32px;
        height: 32px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="crossword-grid">
      <!-- Positioned cells keep the irregular outline while limiting the grid to five defined words -->
      <!-- row 1 -->
      <!-- row 2 -->
      <div class="cell white" data-word="GROWTH" style="grid-row: 1; grid-column: 4;" aria-label="G in GROWTH"></div>
      <div class="cell white" data-word="SOME" style="grid-row: 1; grid-column: 6;" aria-label="S in SOME"></div>
      <!-- row 3 -->
      <div class="cell white" data-word="GROWTH,ROOT" style="grid-row: 2; grid-column: 4;" aria-label="R in GROWTH and ROOT"></div>
      <div class="cell white" data-word="ROOT" style="grid-row: 2; grid-column: 5;" aria-label="O in ROOT"></div>
      <div class="cell white" data-word="ROOT,SOME" style="grid-row: 2; grid-column: 6;" aria-label="O shared by ROOT and SOME"></div>
      <div class="cell white shadow-br" data-word="ROOT" style="grid-row: 2; grid-column: 7;" aria-label="T in ROOT"></div>
      <!-- row 4 -->
      <div class="cell white shadow-br" data-word="BLOOM" style="grid-row: 3; grid-column: 2;" aria-label="B in BLOOM"></div>
      <div class="cell white shadow-br" data-word="BLOOM" style="grid-row: 3; grid-column: 3;" aria-label="L in BLOOM"></div>
      <div class="cell white" data-word="BLOOM,GROWTH" style="grid-row: 3; grid-column: 4;" aria-label="O shared by BLOOM and GROWTH"></div>
      <div class="cell white shadow-br" data-word="BLOOM" style="grid-row: 3; grid-column: 5;" aria-label="O in BLOOM"></div>
      <div class="cell white shadow-br" data-word="BLOOM,SOME" style="grid-row: 3; grid-column: 6;" aria-label="M shared by BLOOM and SOME"></div>
      <!-- row 5 -->
      <div class="cell white" data-word="GROWTH" style="grid-row: 4; grid-column: 4;" aria-label="W in GROWTH"></div>
      <div class="cell white shadow-br" data-word="SOME" style="grid-row: 4; grid-column: 6;" aria-label="E in SOME"></div>
      <!-- row 6 -->
      <div class="cell white shadow-br" data-word="EARTH" style="grid-row: 5; grid-column: 1;" aria-label="E in EARTH"></div>
      <div class="cell white shadow-br" data-word="EARTH" style="grid-row: 5; grid-column: 2;" aria-label="A in EARTH"></div>
      <div class="cell white shadow-br" data-word="EARTH" style="grid-row: 5; grid-column: 3;" aria-label="R in EARTH"></div>
      <div class="cell white" data-word="EARTH,GROWTH" style="grid-row: 5; grid-column: 4;" aria-label="T shared by EARTH and GROWTH"></div>
      <div class="cell white shadow-br" data-word="EARTH" style="grid-row: 5; grid-column: 5;" aria-label="H in EARTH"></div>
      <!-- row 7 -->
      <div class="cell white shadow-br" data-word="GROWTH" style="grid-row: 6; grid-column: 4;" aria-label="H in GROWTH"></div>
      <!-- row 8 -->
      <!-- row 9 -->
      <!-- row 10 -->
    </div>
  </main>
</body>
</html>
